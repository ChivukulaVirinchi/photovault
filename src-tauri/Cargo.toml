[package]
name = "smriti-tauri"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
description = "Tauri shell for Smriti — wraps the smriti library in IPC handlers."
license = "Apache-2.0"
publish = false

[lib]
name = "smriti_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smriti-tauri"
path = "src/main.rs"

[[example]]
name = "smoke"
path = "examples/smoke.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
smriti = { path = ".." }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true

base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
tracing = "0.1"
open = "5"
async-channel = "2"
kamadak-exif = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
# `setsid()` for the show-in-folder fix: file managers spawned by us
# need a fresh session so glib's gio launcher doesn't wrap them in a
# systemd `--scope --user` unit that inherits a non-absolute cwd.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

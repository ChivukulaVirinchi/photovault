[package]
name = "smriti-tauri"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
description = "Tauri shell for Smriti — wraps the smriti library in IPC handlers."
license = "Apache-2.0"
publish = false

[lib]
name = "smriti_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smriti-tauri"
path = "src/main.rs"

[[example]]
name = "smoke"
path = "examples/smoke.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
smriti = { path = ".." }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
reqwest.workspace = true

base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
async-channel = "2"
kamadak-exif = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
# `setsid()` for the show-in-folder fix: file managers spawned by us
# need a fresh session so glib's gio launcher doesn't wrap them in a
# systemd `--scope --user` unit that inherits a non-absolute cwd.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Win32 shell APIs for the reveal-in-folder fix. We use
# SHOpenFolderAndSelectItems via the `windows` crate — explorer.exe
# /select,<path> command-line invocation is unreliable on paths with
# spaces / unusual characters / long paths, even with raw_arg quoting.
# The shell API takes a PIDL and is the documented Microsoft way to
# "open Explorer with this file selected".
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[dev-dependencies]
tempfile = "3"
# Snapshot testing for the wire-format DTOs and JSON shapes produced
# by Tauri command handlers. See tests/dto_snapshots.rs.
# Reviewers update snapshots with `cargo insta review`.
insta = { version = "1", features = ["json"] }

[features]
default = ["custom-protocol", "raw"]
custom-protocol = ["tauri/custom-protocol"]
# Pass-through to smriti's heic feature (libheif-rs). Release builds set
# this so shipped binaries decode HEIC out of the box; default omits it
# so a fresh `cargo build` doesn't require libheif on the system.
heic = ["smriti/heic"]
# Pass-through to smriti's raw feature. Default-on because the
# implementation is pure Rust (no native lib, no link-time risk) — see
# the smriti crate's [features] block for full rationale.
raw = ["smriti/raw"]

[package]
name = "photovault"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Virinchi Chivukula", "Chekka Umesh Kumar", "PhotoVault contributors"]
license = "Apache-2.0"
description = "Offline-first desktop photo library manager with face recognition, smart albums, and full-text search."
repository = "https://github.com/ChivukulaVirinchi/photovault"
homepage = "https://chivukulavirinchi.github.io/photovault/"
documentation = "https://chivukulavirinchi.github.io/photovault/"
readme = "README.md"
keywords = ["photos", "gallery", "face-recognition", "offline", "desktop"]
categories = ["multimedia::images", "gui"]
exclude = [
    "/docs",
    "/scripts",
    "/.github",
    "/website",
    "/assets/screenshots",
    "/.claude",
]

[dependencies]
# UI Framework
iced = { version = "0.13", features = ["image", "svg", "tokio", "advanced", "canvas"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "blob"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# File system utilities
walkdir = "2"
dirs = "5"                      # Platform-specific directories

# Hashing
sha2 = "0.10"

# Image processing
image = "0.25"
imageproc = "0.24"

# ONNX Runtime for ML inference (face detection/recognition)
# Using load-dynamic to load libonnxruntime.so at runtime via dlopen.
# This avoids linking against a prebuilt static lib that requires glibc 2.38+.
# Place the ONNX Runtime 1.23.x shared library in libs/onnxruntime/ or set ORT_DYLIB_PATH.
# default-features = false is critical: the default features include download-binaries.
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda", "directml", "coreml"] }

# Linear algebra for face embeddings
ndarray = "0.16"

# EXIF extraction
kamadak-exif = "0.5"

# Parallel processing
rayon = "1.10"

# Additional async utilities
async-channel = "2.0"
lru = "0.16"

# Regex for filename parsing
regex = "1"
lazy_static = "1.4"

# Native file dialogs
rfd = "0.15"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"

# Update mechanism (Phase 3)
semver = { version = "1", features = ["serde"] }
self_update = { version = "0.41", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate"] }
futures = "0.3"
open = "5"

# Optimize key deps even in debug mode — image decoding is unusable without this
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.jpeg-decoder]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.imageproc]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ort-sys]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Virinchi Chivukula, Chekka Umesh Kumar"
copyright = "2026, Virinchi Chivukula"
license-file = ["LICENSE", "0"]
extended-description = """\
PhotoVault is an offline-first desktop photo library manager.
Indexes photos from local drives, detects faces, finds duplicates,
suggests albums, and provides full-text search -- all without uploading
anything to the cloud.
"""
depends = "$auto"
section = "graphics"
priority = "optional"
assets = [
    ["target/release/photovault", "usr/bin/", "755"],
    ["packaging/photovault.desktop", "usr/share/applications/", "644"],
    ["packaging/photovault.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/photovault/README", "644"],
]

[package.metadata.bundle]
name = "PhotoVault"
identifier = "com.chivukulavirinchi.photovault"
icon = ["packaging/photovault.icns"]
version = "0.2.0"
copyright = "2026, Virinchi Chivukula"
category = "public.app-category.photography"
short_description = "Offline-first photo library manager"
long_description = """
PhotoVault organizes your photos locally, with face recognition,
smart albums, and full-text search -- without uploading anything.
"""
resources = []
osx_minimum_system_version = "10.13"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "clustering"
harness = false

[[bench]]
name = "hashing"
harness = false

[workspace]
members = [".", "src-tauri"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }

[package]
name = "smriti"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["Virinchi Chivukula", "Chekka Umesh Kumar", "Smriti contributors"]
license = "Apache-2.0"
description = "Offline-first desktop photo library manager with face recognition, smart albums, and full-text search."
repository = "https://github.com/ChivukulaVirinchi/photovault"
homepage = "https://chivukulavirinchi.github.io/photovault/"
documentation = "https://chivukulavirinchi.github.io/photovault/"
readme = "README.md"
keywords = ["photos", "gallery", "face-recognition", "offline", "desktop"]
categories = ["multimedia::images", "gui"]
exclude = [
    "/docs",
    "/scripts",
    "/.github",
    "/website",
    "/assets/screenshots",
    "/.claude",
]

[features]
# `heic` decodes HEIC/HEIF photos via libheif. Off by default so a
# `cargo build` from a fresh checkout doesn't fail on a missing
# system library. Every release build (.deb, AppImage, macOS .tar.gz)
# passes `--features heic` explicitly — see .github/workflows/release.yml
# — so shipped binaries decode iPhone HEIC out of the box. Windows
# MSI ships without HEIC for now; the libheif Windows build chain
# is fragile and slated for v1.1.
#
# `hnsw_clustering` swaps Stage B agglomerative complete-link for
# HNSW-based approximate nearest neighbor + union-find. Quadratic
# cost goes away — clustering scales linearly past the legacy 800-face
# cap. Default-on; can be disabled to A/B against the original.
#
# `raw` enables embedded-JPEG-preview decoding for TIFF-based RAW
# formats (NEF, CR2, CR3, ARW, DNG, ORF, RW2, PEF, RWL, SRW, RAF).
# No new crate dep — uses kamadak-exif (already on the dep graph) to
# walk IFDs, then `image::load_from_memory` on the embedded JPEG.
# Default-on because there's nothing to fail at link time: the
# extraction is pure Rust + byte slicing. Disable to A/B against a
# no-RAW build or to shrink the dispatch surface in a constrained
# context (it's a single function arm, but the option exists).
default = ["hnsw_clustering", "raw"]
heic = ["dep:libheif-rs"]
hnsw_clustering = ["dep:hnsw_rs"]
raw = []

[lib]
# Library-only crate. The bin lives in src-tauri/.
name = "smriti"

[dependencies]
# Database
rusqlite = { version = "0.32", features = ["bundled", "blob"] }

# Async runtime
tokio.workspace = true
reqwest.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# File system utilities
walkdir = "2"
dirs = "5"                      # Platform-specific directories

# Hashing
sha2 = "0.10"

# Image processing
image = "0.25"

# Optional HEIC decoder. Requires the `libheif` system library at
# runtime (apt install libheif-dev / brew install libheif / Windows
# binaries shipped with the asset pack). Gated behind the `heic`
# Cargo feature so default builds still work without the system dep.
#
# `default-features = false` skips libheif-rs's `latest` feature
# (which assumes libheif 1.21+) and the optional `image` glue (we
# have our own pipeline). The `v1_17` feature pins the API surface
# to libheif 1.17 — the version on Ubuntu 24.04 LTS, macOS Homebrew,
# and the Smriti-Assets Windows asset pack. Without one of
# `v1_17`..`v1_21`, `libheif-sys` refuses to build with
# "you MUST enable one of the crate features".
libheif-rs = { version = "2", optional = true, default-features = false, features = ["v1_17"] }

# Approximate nearest-neighbor index for face clustering. Pure Rust,
# no system deps. Behind `hnsw_clustering` feature (default-on) so we
# can A/B against the legacy complete-link path during rollout.
hnsw_rs = { version = "0.3", optional = true }

# Perceptual-hash duplicate detection. 64-bit DCT hash, ~1 ms per
# image when run against the cached Small thumbnail.
image_hasher = "3"

# ONNX Runtime for ML inference (face detection/recognition)
# Using load-dynamic to load libonnxruntime.so at runtime via dlopen.
# This avoids linking against a prebuilt static lib that requires glibc 2.38+.
# Place the ONNX Runtime 1.23.x shared library in libs/onnxruntime/ or set ORT_DYLIB_PATH.
# default-features = false is critical: the default features include download-binaries.
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda", "directml", "coreml", "openvino", "onednn", "xnnpack"] }

# Linear algebra for face embeddings
ndarray = "0.16"

# EXIF extraction
kamadak-exif = "0.5"

# Parallel processing
rayon = "1.10"

# Additional async utilities
async-channel = "2.0"
lru = "0.16"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Regex for filename parsing
regex = "1"
lazy_static = "1.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# Update mechanism (Phase 3)
semver = { version = "1", features = ["serde"] }
self_update = { version = "0.41", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate"] }
futures = "0.3"
open = "5"

# Optimize key deps even in debug mode — image decoding is unusable without this
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ort-sys]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Bundle configuration moved to src-tauri/tauri.conf.json — Tauri's
# bundler owns .deb, AppImage, .msi, and .dmg packaging now.

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
# `insta` provides inline snapshot tests. Used by integration tests
# under `tests/` and by `src-tauri/tests/dto_snapshots.rs` to catch
# accidental breakage of the wire-format contract between Rust and
# the Svelte frontend. Reviewers update snapshots with the CLI
# `cargo insta review`.
insta = { version = "1", features = ["json"] }

[[bench]]
name = "clustering"
harness = false

[[bench]]
name = "hashing"
harness = false

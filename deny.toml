# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates shouldn't block a release on their own — the ecosystem
# drifts faster than our transitive deps can follow. We fail on actual
# vulnerabilities and on yanks; unmaintained/unsound surface as info.
unmaintained = "none"
# Only advisories that still match something in Cargo.lock. An entry that
# outlives its crate would silently mute the advisory if the crate came back,
# so a stale one fails the check.
unused-ignored-advisory = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "BSL-1.0",          # clipboard-win, error-code (transitive via iced)
    "NCSA",             # libfuzzer-sys (transitive via rav1e -> image)
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # paste 1.0.15 is unmaintained but pulled transitively by iced -> wgpu -> metal,
    # by image -> ravif -> rav1e, and by imageproc -> nalgebra -> simba.
    # No safe upgrade is available upstream. Re-evaluate when iced/wgpu/rav1e move off it.
    "RUSTSEC-2024-0436",
    # custom_derive (RUSTSEC-2025-0058) - unmaintained, transitive via iced.
    "RUSTSEC-2025-0058",
    # instant (RUSTSEC-2024-0384) - unmaintained, transitive via iced/wgpu/parking_lot.
    "RUSTSEC-2024-0384",
    # core2 0.4.0 is yanked but pinned by bitstream-io 4.9.0 (transitive via
    # rav1e -> ravif -> image). Cannot upgrade without bitstream-io publishing
    # a release that loosens the pin. Tracked: re-check on each image bump.
    { crate = "core2@0.4.0", reason = "transitive via rav1e; no upstream replacement available" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "BSL-1.0",          # clipboard-win, error-code (transitive via iced)
    "NCSA",             # libfuzzer-sys (transitive via rav1e -> image)
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

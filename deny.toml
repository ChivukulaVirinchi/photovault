# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates shouldn't block a release on their own — the ecosystem
# drifts faster than our transitive deps can follow. We fail on actual
# vulnerabilities and on yanks; unmaintained/unsound surface as info.
unmaintained = "none"
ignore = [
    # Known transitive unmaintained/yank chain. Kept documented so future
    # audits don't re-investigate the same ground. These no longer block
    # CI (see `unmaintained = "none"` above) but we track them here anyway.
    "RUSTSEC-2024-0436",  # paste — transitive via iced/wgpu, image/rav1e, imageproc/nalgebra
    "RUSTSEC-2025-0058",  # custom_derive — transitive via iced
    "RUSTSEC-2024-0384",  # instant — transitive via iced/wgpu/parking_lot
    { crate = "core2@0.4.0", reason = "yanked; pinned transitively by bitstream-io via rav1e; no upstream replacement" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "BSL-1.0",          # clipboard-win, error-code (transitive via iced)
    "NCSA",             # libfuzzer-sys (transitive via rav1e -> image)
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

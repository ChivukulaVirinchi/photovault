version: 2
# Dependabot is tuned for a hobby project: monthly cadence so Monday
# mornings don't drown in a dozen PRs, and a single grouped PR per
# ecosystem so a minor bump across five crates opens one review, not
# five. Majors still land as individual PRs so the reviewer sees the
# breaking change in isolation.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types:
          - patch
          - minor
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - patch
          - minor
    labels:
      - dependencies
      - github-actions

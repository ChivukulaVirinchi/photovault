name: Release

# Tauri-based release pipeline. Replaces the iced-era cargo-deb / WiX
# matrix; Tauri's bundler now produces .deb, .AppImage, .msi, .dmg
# directly from `tauri build`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            heic_flag: "--features heic"
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            heic_flag: "--features heic"
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Windows skipped on heic for v1 — libheif build chain is fragile.
            heic_flag: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            libheif-dev

      - name: Install macOS deps
        if: matrix.os == 'macos-latest'
        run: brew install libheif

      - name: Install frontend dependencies
        run: npm ci --prefix src-ui

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Smriti ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.heic_flag }}

  assets-pack:
    name: Build asset pack
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download ONNX models + GeoNames + ORT
        run: |
          mkdir -p assets-pack/models assets-pack/data assets-pack/libs/onnxruntime
          # Models
          curl -sSLfo assets-pack/models/scrfd_10g_bnkps.onnx \
            https://github.com/deepinsight/insightface/releases/download/v0.7/scrfd_10g_bnkps.onnx
          curl -sSLfo assets-pack/models/glintr100.onnx \
            https://github.com/deepinsight/insightface/releases/download/v0.7/glintr100.onnx
          # GeoNames cities1000 + country codes
          curl -sSLfo /tmp/cities1000.zip http://download.geonames.org/export/dump/cities1000.zip
          unzip -o /tmp/cities1000.zip -d assets-pack/data/
          curl -sSLfo assets-pack/data/country_codes.txt \
            https://download.geonames.org/export/dump/countryInfo.txt
          # ORT shared libs (one .so for Linux, one .dll for Windows)
          # The setup_assets.sh script already knows the URL/version of choice.
          ./scripts/setup_assets.sh --download-only --target ./assets-pack || true
      - name: Zip pack
        run: |
          cd assets-pack
          zip -r ../Smriti-Assets.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: smriti-assets
          path: Smriti-Assets.zip

  release:
    name: Attach asset pack to release
    needs: [build, assets-pack]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smriti-assets
      - name: Upload asset pack to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Smriti-Assets.zip
          draft: true
          prerelease: false

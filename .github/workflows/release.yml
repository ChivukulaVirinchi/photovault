name: Release

# Tauri-based release pipeline. Replaces the iced-era cargo-deb / WiX
# matrix; Tauri's bundler now produces .deb, .AppImage, .msi, .dmg
# directly from `tauri build`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            # ubuntu-24.04 carries libheif 1.17+, which is the API
            # version our `libheif-rs` pins to via the `v1_17` feature.
            # ubuntu-22.04 only ships libheif 1.12 and would fail to
            # link the heic build path.
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            heic_flag: "--features heic"
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            heic_flag: "--features heic"
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Windows skipped on heic for v1 — libheif build chain is fragile.
            heic_flag: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            libheif-dev

      - name: Install macOS deps
        if: matrix.os == 'macos-latest'
        run: brew install libheif

      - name: Install frontend dependencies
        run: npm ci --prefix src-ui

      # tauri-action runs `beforeBuildCommand` from the repo root, not from
      # `src-tauri/`, so a relative `--prefix ../src-ui` would escape the
      # checkout. Build the frontend explicitly here and let Tauri pick up
      # the prebuilt `frontendDist`.
      - name: Build frontend
        run: npm run build --prefix src-ui

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Smriti ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.heic_flag }}

  assets-pack:
    name: Build asset pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download ONNX models + GeoNames + ORT
        run: |
          set -euo pipefail
          mkdir -p assets-pack/models assets-pack/data \
                   assets-pack/libs/onnxruntime/linux \
                   assets-pack/libs/onnxruntime/windows

          # Face models (Hugging Face mirror — same as scripts/setup_assets.sh)
          curl -fsSL --retry 6 --retry-delay 2 --retry-all-errors \
            -o assets-pack/models/scrfd_10g_bnkps.onnx \
            https://huggingface.co/MonsterMMORPG/tools/resolve/main/scrfd_10g_bnkps.onnx
          curl -fsSL --retry 6 --retry-delay 2 --retry-all-errors \
            -o assets-pack/models/glintr100.onnx \
            https://huggingface.co/MonsterMMORPG/tools/resolve/main/glintr100.onnx

          # GeoNames cities1000 + country codes
          curl -fsSL --retry 6 --retry-delay 2 --retry-all-errors \
            -o /tmp/cities1000.zip \
            https://download.geonames.org/export/dump/cities1000.zip
          unzip -o /tmp/cities1000.zip -d assets-pack/data/
          curl -fsSL --retry 6 --retry-delay 2 --retry-all-errors \
            -o assets-pack/data/country_codes.txt \
            https://download.geonames.org/export/dump/countryInfo.txt

          # ONNX Runtime — Linux x64 .so
          ORT_VER=1.23.0
          curl -fsSL --retry 6 --retry-delay 2 --retry-all-errors \
            -o /tmp/ort-linux.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
          mkdir -p /tmp/ort-linux
          tar -xzf /tmp/ort-linux.tgz -C /tmp/ort-linux
          cp /tmp/ort-linux/onnxruntime-linux-x64-${ORT_VER}/lib/libonnxruntime.so* \
             assets-pack/libs/onnxruntime/linux/

          # ONNX Runtime — Windows x64 .dll
          curl -fsSL --retry 6 --retry-delay 2 --retry-all-errors \
            -o /tmp/ort-win.zip \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-win-x64-${ORT_VER}.zip"
          unzip -o /tmp/ort-win.zip -d /tmp/ort-win
          cp /tmp/ort-win/onnxruntime-win-x64-${ORT_VER}/lib/onnxruntime.dll \
             assets-pack/libs/onnxruntime/windows/

      - name: Zip pack
        run: |
          cd assets-pack
          zip -r ../Smriti-Assets.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: smriti-assets
          path: Smriti-Assets.zip

  release:
    name: Attach asset pack to release
    needs: [build, assets-pack]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smriti-assets
      - name: Upload asset pack to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Smriti-Assets.zip
          draft: true
          prerelease: false

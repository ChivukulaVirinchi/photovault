name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config

      - name: Download ML models + GeoNames data
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/setup_assets.sh

      - name: Download ML models + GeoNames data (Windows)
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/setup_assets.ps1

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact directory
        shell: bash
        run: |
          mkdir -p staging/photovault/scripts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/photovault.exe staging/photovault/
          else
            cp target/${{ matrix.target }}/release/photovault staging/photovault/
          fi
          cp -r libs staging/photovault/
          cp -r models staging/photovault/
          cp -r data staging/photovault/
          cp README.md LICENSE staging/photovault/
          cp scripts/setup_assets.sh scripts/setup_assets.ps1 staging/photovault/scripts/ 2>/dev/null || true

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd staging
          tar -czf ../photovault-${{ matrix.target }}.tar.gz photovault

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path staging\photovault -DestinationPath photovault-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: photovault-${{ matrix.target }}
          path: photovault-${{ matrix.target }}.*

  appimage:
    name: Linux AppImage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: photovault-x86_64-unknown-linux-gnu
      - name: Extract
        run: tar -xzf photovault-x86_64-unknown-linux-gnu.tar.gz
      - name: Install AppImage tool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build AppDir
        run: |
          mkdir -p PhotoVault.AppDir/usr/bin
          mkdir -p PhotoVault.AppDir/usr/lib/photovault
          mkdir -p PhotoVault.AppDir/usr/share/applications
          mkdir -p PhotoVault.AppDir/usr/share/icons/hicolor/256x256/apps
          cp photovault/photovault PhotoVault.AppDir/usr/bin/
          cp -r photovault/libs PhotoVault.AppDir/usr/lib/photovault/
          cp -r photovault/models PhotoVault.AppDir/usr/lib/photovault/
          cp -r photovault/data PhotoVault.AppDir/usr/lib/photovault/
          cp packaging/photovault.desktop PhotoVault.AppDir/usr/share/applications/
          cp packaging/photovault.png PhotoVault.AppDir/usr/share/icons/hicolor/256x256/apps/
          cp packaging/photovault.desktop PhotoVault.AppDir/
          cp packaging/photovault.png PhotoVault.AppDir/
          cat > PhotoVault.AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PHOTOVAULT_ASSET_DIR="${HERE}/usr/lib/photovault"
          cd "${HERE}/usr/bin"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/photovault/libs/onnxruntime:$LD_LIBRARY_PATH"
          exec "${HERE}/usr/bin/photovault" "$@"
          EOF
          chmod +x PhotoVault.AppDir/AppRun
      - name: Build AppImage
        run: ./appimagetool-x86_64.AppImage PhotoVault.AppDir PhotoVault-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: photovault-appimage
          path: PhotoVault-x86_64.AppImage

  deb:
    name: Linux deb
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config
      - name: Download ML models + GeoNames data
        shell: bash
        run: ./scripts/setup_assets.sh
      - name: Build deb
        run: cargo deb
      - name: Normalize DEB artifact name
        shell: bash
        run: |
          set -euo pipefail
          deb_file=$(ls target/debian/*.deb | grep -v dbgsym | head -n 1)
          cp "$deb_file" "target/debian/PhotoVault-ubuntu-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: photovault-deb
          path: |
            target/debian/PhotoVault-ubuntu-amd64.deb
            target/debian/*.deb

  smoke-deb:
    name: Smoke test .deb installer
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photovault-deb
          path: artifacts/deb
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon0 libwayland-client0 libxcb1 libx11-6 libegl1 libgl1
      - name: Verify .deb contents
        shell: bash
        run: |
          set -euo pipefail
          deb_file=$(find artifacts/deb -name "PhotoVault-ubuntu-amd64.deb" | head -n 1)
          test -n "$deb_file"
          dpkg-deb -c "$deb_file" | grep -q "./usr/bin/photovault"
          dpkg-deb -c "$deb_file" | grep -q "./usr/lib/photovault/models/"
          dpkg-deb -c "$deb_file" | grep -q "./usr/lib/photovault/data/geonames.db"
      - name: Install .deb
        shell: bash
        run: |
          set -euo pipefail
          deb_file=$(find artifacts/deb -name "PhotoVault-ubuntu-amd64.deb" | head -n 1)
          sudo dpkg -i "$deb_file"
          sudo apt-get -f install -y
      - name: Launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xvfb-run -a env RUST_LOG=photovault=info timeout 20s photovault
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "photovault exited with unexpected code $code"
            exit $code
          fi

  smoke-appimage:
    name: Smoke test AppImage
    needs: appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photovault-appimage
          path: artifacts/appimage
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon0 libwayland-client0 libxcb1 libx11-6 libegl1 libgl1
      - name: Verify AppImage layout
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find artifacts/appimage -name "PhotoVault-x86_64.AppImage" | head -n 1)
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -f squashfs-root/usr/bin/photovault
          test -d squashfs-root/usr/lib/photovault/models
          test -f squashfs-root/usr/lib/photovault/data/geonames.db
      - name: Launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find artifacts/appimage -name "PhotoVault-x86_64.AppImage" | head -n 1)
          chmod +x "$appimage"
          set +e
          xvfb-run -a env RUST_LOG=photovault=info APPIMAGE_EXTRACT_AND_RUN=1 timeout 20s "$appimage"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "AppImage exited with unexpected code $code"
            exit $code
          fi

  checksums:
    name: Linux checksums
    needs: [appimage, deb, smoke-appimage, smoke-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          appimage=$(find . -name "PhotoVault-x86_64.AppImage" | head -n 1)
          deb=$(find . -name "PhotoVault-ubuntu-amd64.deb" | head -n 1)
          : > SHA256SUMS
          sha256sum "$appimage" >> SHA256SUMS
          sha256sum "$deb" >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: photovault-checksums
          path: artifacts/SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build, appimage, deb, smoke-appimage, smoke-deb, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  quality:
    name: Quality ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-run
      - run: cargo test

  msrv:
    name: MSRV (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo check --all-targets

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    # rustsec/audit-check posts findings as a GitHub Check Run, which needs
    # checks:write. On PRs from forks the token is read-only and the post
    # can still fail — so we also fall back to the CLI, which just exits
    # non-zero on vulnerabilities and is what actually gates merges.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit (actual gate)
        # cargo-audit exits non-zero only on real vulnerabilities by
        # default; unmaintained/unsound/yanked are warnings we surface
        # but don't block on. The deny job covers dupes/licenses; we
        # intentionally don't pass --deny warnings here.
        run: cargo audit

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  bench:
    name: Benches smoke test
    runs-on: ubuntu-latest
    # Compile-only gate with a hard ceiling. The release profile uses
    # thin LTO + codegen-units=1 so full bench compilation is ~15 min on
    # a cold CI runner; we bounded it here so a runaway never burns an
    # hour like it did in the first release run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # Compile-only smoke test. Actually running the benches requires
      # warmup iterations that, combined with the heavy release profile,
      # push the job past the free-tier runner time budget. We gate
      # compile breakage here; perf regressions need committed baselines
      # under `benches/baselines/` and a separate nightly job — deferred
      # until we have a stable baseline worth committing.
      - run: cargo bench --workspace --no-run

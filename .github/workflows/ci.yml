name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES.md'
      - '.github/workflows/docs.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  quality:
    name: Quality ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs run Linux only to conserve minutes (Windows = 2x, macOS =
        # 10x). Pushes to master keep the full matrix; the release
        # pipeline exercises Windows + macOS independently.
        os: ${{ github.event_name == 'pull_request' && fromJson('["ubuntu-latest"]') || fromJson('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Tauri 2 system deps. Linux needs WebKit + GTK + libsoup; macOS
      # gets WebKit through Xcode (preinstalled on macos-latest); Windows
      # uses the preinstalled WebView2 runtime, so no apt-equivalent
      # step is needed there.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      # Frontend dist must exist before any Rust build of `smriti-tauri`
      # — `tauri::generate_context!` reads it at compile time and the
      # build aborts if the path is missing.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src-ui/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix src-ui
      - name: Frontend type check
        run: npm run check --prefix src-ui
      - name: Build frontend
        run: npm run build --prefix src-ui

      - run: cargo clippy --all-targets -p smriti -p smriti-tauri -- -D warnings
      # `cargo test` already builds before running, so a separate
      # `--no-run` step would just duplicate the compile.
      - run: cargo test -p smriti -p smriti-tauri

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci --prefix src-ui
      - run: npm run build --prefix src-ui
      - run: cargo check --all-targets -p smriti -p smriti-tauri

  supply-chain:
    name: Supply chain (audit + deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        # cargo-audit exits non-zero only on real vulnerabilities by
        # default; unmaintained/unsound/yanked are warnings we surface
        # but don't block on. The deny step below covers dupes/licenses.
        run: cargo audit
      - name: Run cargo deny (bans, licenses, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

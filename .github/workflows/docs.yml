name: Deploy site + docs

on:
  push:
    branches: [master, main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'book.toml'
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow only one concurrent deployment, queueing newer pushes.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The rustdoc step only documents the engine crate (`-p smriti`),
      # which is pure Rust with no webkit / gtk / frontend coupling.
      # That lets us skip the Tauri apt deps + Node + frontend build
      # that the CI workflow needs.

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build user + contributor docs (mdBook)
        run: mdbook build

      # Only document the engine — `smriti-tauri` would drag in
      # `tauri::generate_context!` (which reads the frontend dist) and
      # webkit-dependent build deps. The /api/ landing redirects into
      # /api/smriti/ either way, so this is the docs surface readers
      # actually want. `--all-features` is intentionally omitted: the
      # `heic` feature pins to `libheif-rs` which needs a system
      # libheif we'd otherwise have to install for a docs-only run.
      - name: Build API docs (rustdoc)
        run: cargo doc --no-deps -p smriti --features hnsw_clustering
        env:
          RUSTDOCFLAGS: '-D warnings'

      - name: Stage publish directory
        run: |
          set -euo pipefail
          mkdir -p dist
          # Landing page assets at the root.
          cp -R website/. dist/
          # Hand-written stub HTMLs in website/docs/ are replaced by mdBook output.
          rm -rf dist/docs
          mkdir -p dist/docs
          cp -R book/. dist/docs/
          # Rustdoc output at /api/, with a redirect index so /api/ lands on the crate docs.
          mkdir -p dist/api
          cp -R target/doc/. dist/api/
          cat > dist/api/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>Smriti API</title>
          <meta http-equiv="refresh" content="0; url=./smriti/">
          <link rel="canonical" href="./smriti/">
          <p>Redirecting to <a href="./smriti/">smriti crate docs</a>&hellip;</p>
          EOF

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
